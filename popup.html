<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="popup.css" />
    <script src="redirectState.function.js"></script>
  </head>
  <body class="popup">
    <div class="chartink-to-tv-container">
      <h1>Chartink To TradingView</h1>
      <p class="description">By devAgam</p>
      <label class="checkbox-container">
        <input type="checkbox" id="redirect" name="redirect" />
        <span class="checkmark"></span>
        Chart Redirects To TradingView
      </label>
      <label class="checkbox-container">
        <input type="checkbox" id="kite-bt" name="kite-bt" />
        <span class="checkmark"></span>
        Open Chart in Kite Button
      </label>
      <!-- dropdown to select between Kite chart TradingView or ChartIQ -->
      <label class="chart-type" for="chart-type">Kite Chart:</label>
      <select class="chart-dropdown" id="chart-type" name="chart-type">
        <option value="tvc">TradingView</option>
        <option value="ciq">ChartIQ</option>
      </select>

      <label class="checkbox-container">
        <input type="checkbox" id="enable-shortcut" name="enable-shortcut" />
        <span class="checkmark"></span>
        Enable shortcut (<span id="shortcut-combo">Cmd+Shift+C</span>)
      </label>
      <p class="hint">Shortcut works only on the screener page.</p>

      <label class="checkbox-container">
        <input type="checkbox" id="hover-chart-beta" name="hover-chart-beta" />
        <span class="checkmark"></span>
        Live Hover Chart
      </label>

      <!-- <div style="display: flex; gap: 8px; margin-top: 8px">
        <button
          id="popup-download"
          class="donate-bt"
          style="
            background-color: #3970af;
            border: 1px solid rgba(27, 31, 35, 0.15);
          "
        >
          Download CSV
        </button>
      </div> -->

      <br />
      <a class="donate-bt" href="https://agamjot.ca/donate" target="_blank"
        >Donate</a
      >
      <div style="display: flex; gap: 8px; margin-top: 8px">
        <a class="donate-bt" href="mailto:me@devagam.com" target="_blank"
          >Email Support</a
        >
        <a class="donate-bt" href="https://x.com/devAgamjot" target="_blank"
          >Twitter</a
        >
      </div>
      <p class="description">You can email me at me@devagam.com</p>
    </div>
  </body>
</html>
